<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cricket Points Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #102418;
      --muted: #4a6354;
      --surface: rgba(255, 252, 245, 0.92);
      --line: rgba(16, 36, 24, 0.12);
      --accent: #1f7a45;
      --accent-hot: #d4a017;
      --top-glow: rgba(31, 122, 69, 0.14);
      --shadow: 0 18px 40px rgba(12, 40, 22, 0.18);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      font-family: "Sora", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 60% at 10% -10%, rgba(212, 160, 23, 0.28), transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 0%, rgba(31, 122, 69, 0.35), transparent 50%),
        linear-gradient(165deg, #e8f5e9 0%, #d4e8d0 38%, #c5dcc0 100%);
      background-attachment: fixed;
      overflow-x: auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 47px,
          rgba(16, 36, 24, 0.03) 47px,
          rgba(16, 36, 24, 0.03) 48px
        );
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 20px 48px;
      min-height: 100vh;
    }

    .brand {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(2.6rem, 9vw, 4.2rem);
      letter-spacing: 0.04em;
      line-height: 0.95;
      margin: 0 0 6px;
      color: var(--ink);
      animation: rise 0.7s ease-out both;
    }

    .tagline {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
      max-width: 28rem;
      animation: rise 0.7s ease-out 0.08s both;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      animation: rise 0.7s ease-out 0.16s both;
    }

    .stat {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    .stat strong {
      color: var(--ink);
      font-weight: 700;
    }

    .btn {
      appearance: none;
      border: 1.5px solid var(--ink);
      background: var(--ink);
      color: #f7fff8;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .btn:hover {
      background: transparent;
      color: var(--ink);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .board {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 0;
      animation: rise 0.75s ease-out 0.24s both;
    }

    .scroll-hint {
      display: none;
      padding: 10px 14px 0;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 500;
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scrollbar-color: var(--accent) transparent;
    }

    .table-scroll::-webkit-scrollbar {
      height: 8px;
    }

    .table-scroll::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 999px;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      margin: 0;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f3faf3;
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      text-align: left;
      padding: 14px 12px;
      border-bottom: 2px solid var(--line);
      white-space: nowrap;
    }

    tbody td {
      padding: 14px 12px;
      vertical-align: middle;
      border-top: 1px solid var(--line);
      white-space: nowrap;
    }

    tbody tr {
      transition: background 0.2s ease;
    }

    tbody tr:hover {
      background: rgba(31, 122, 69, 0.06);
    }

    .top {
      background: linear-gradient(90deg, var(--top-glow), transparent 70%);
      border-left: 4px solid var(--accent);
    }

    .rank {
      font-family: "Bebas Neue", sans-serif;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      width: 40px;
      color: var(--muted);
    }

    .top .rank {
      color: var(--accent);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      margin-right: 12px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(16, 36, 24, 0.2);
    }

    .namecell {
      display: flex;
      align-items: center;
    }

    .player-name {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .muted {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 2px;
    }

    .pct {
      font-weight: 700;
      min-width: 2.5rem;
    }

    .bar-wrap {
      height: 8px;
      background: rgba(16, 36, 24, 0.08);
      border-radius: 999px;
      overflow: hidden;
      width: 120px;
    }

    .bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-hot));
      border-radius: inherit;
      width: 0%;
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .win-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sort {
      cursor: pointer;
      user-select: none;
    }

    .sort::after {
      content: "↕";
      margin-left: 6px;
      font-size: 0.65rem;
      opacity: 0.55;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .page {
        padding: 20px 12px 56px;
      }

      .brand {
        font-size: clamp(2.4rem, 12vw, 3.4rem);
      }

      .scroll-hint {
        display: block;
      }

      .table-scroll {
        max-height: min(70vh, 520px);
        overflow-y: auto;
        overflow-x: auto;
      }

      table {
        min-width: 680px;
      }

      thead th,
      tbody td {
        padding: 12px 10px;
      }

      .bar-wrap {
        width: 90px;
      }
    }

    @media (max-width: 480px) {
      .page {
        padding: 16px 10px 64px;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        width: 100%;
        text-align: center;
      }

      .table-scroll {
        max-height: 62vh;
      }

      table {
        min-width: 640px;
      }

      .avatar {
        width: 36px;
        height: 36px;
        margin-right: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1 class="brand">Cricket Points Table</h1>
    <p class="tagline">Swipe the board sideways on phones — scroll up and down when the list runs long.</p>

    <div class="toolbar">
      <div class="stat">Matches played: <strong id="totalMatches">0</strong></div>
      <button class="btn" type="button" id="resetBtn">Reset sort</button>
    </div>

    <div class="board">
      <div class="scroll-hint">← Scroll table horizontally · scroll vertically for more rows →</div>
      <div class="table-scroll" tabindex="0" aria-label="Points table, scrollable">
        <table id="pointsTable">
          <thead>
            <tr>
              <th class="sort" data-key="rank">#</th>
              <th class="sort" data-key="name">Name</th>
              <th class="sort" data-key="played">Played</th>
              <th class="sort" data-key="won">Won</th>
              <th class="sort" data-key="lost">Lost</th>
              <th class="sort" data-key="draw">Draw</th>
              <th class="sort" data-key="points">Pts</th>
              <th class="sort" data-key="winPerc">Win %</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const teams = [
      {name:'Pritam', played:3, won:0, lost:3, draw:0},
      {name:'Polard', played:2, won:2, lost:0, draw:0},
      {name:'Basu', played:0, won:0, lost:0, draw:0},
      {name:'Sujit', played:2, won:1, lost:1, draw:0},
      {name:'Bunty', played:2, won:2, lost:0, draw:0},
      {name:'Dinesh', played:1, won:0, lost:1, draw:0}
    ];

    function computeStats(list){
      return list.map(t=>{
        const winPerc = t.played? Math.round((t.won / t.played) * 100) : 0;
        const points = t.won*2 + t.draw*1;
        return {...t, winPerc, points};
      });
    }

    let data = computeStats(teams);
    const tbody = document.querySelector('#pointsTable tbody');
    const totalMatchesEl = document.getElementById('totalMatches');

    function render(list){
      const sorted = [...list].sort((a,b)=>{
        if (b.points !== a.points) return b.points - a.points;
        if (b.winPerc !== a.winPerc) return b.winPerc - a.winPerc;
        if (b.won !== a.won) return b.won - a.won;
        return a.name.localeCompare(b.name);
      });
      tbody.innerHTML = '';
      sorted.forEach((t, i)=>{
        const tr = document.createElement('tr');
        if(i===0) tr.classList.add('top');
        const avatarColor = nameToColor(t.name);
        const initials = t.name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();
        tr.innerHTML =
          `<td class="rank">${i+1}</td>` +
          `<td><div class="namecell"><div class="avatar" style="background:${avatarColor};">${initials}</div><div><div class="player-name">${t.name}</div><div class="muted">Points: ${t.points} · Won ${t.won}</div></div></div></td>` +
          `<td>${t.played}</td>` +
          `<td>${t.won}</td>` +
          `<td>${t.lost}</td>` +
          `<td>${t.draw}</td>` +
          `<td><strong>${t.points}</strong></td>` +
          `<td><div class="win-cell"><div class="bar-wrap" aria-hidden="true"><div class="bar" style="width:${t.played? t.winPerc:0}%"></div></div><div class="pct">${t.played? t.winPerc + '%':'-'}</div></div></td>`;
        tbody.appendChild(tr);
      });
      const totalMatches = list.reduce((s,x)=>s + (x.played||0),0)/2;
      totalMatchesEl.textContent = Math.round(totalMatches);
    }

    function nameToColor(name){
      const colors = ['#1f7a45','#0e5c8c','#c45c26','#b91c1c','#0f766e','#a16207'];
      let h=0; for(let i=0;i<name.length;i++) h = (h<<5) - h + name.charCodeAt(i);
      return colors[Math.abs(h) % colors.length];
    }

    render(data);

    document.querySelectorAll('thead th.sort').forEach(th=>{
      th.addEventListener('click', ()=>{
        sortBy(th.dataset.key);
      });
    });

    let lastSort = null;
    function sortBy(key){
      const dir = lastSort && lastSort.key === key && lastSort.dir === 'desc' ? 'asc' : 'desc';
      lastSort = {key, dir};
      const sorted = [...data].sort((a,b)=>{
        let A = a[key]; let B = b[key];
        if(key === 'name') {
          A = A.toLowerCase();
          B = B.toLowerCase();
          return dir==='desc'? A.localeCompare(B) : B.localeCompare(A);
        }
        if(key === 'rank') {
          return dir==='desc' ? (a.points - b.points) : (b.points - a.points);
        }
        if(typeof A === 'undefined') A = 0;
        if(typeof B === 'undefined') B = 0;
        return dir==='desc' ? B - A : A - B;
      });
      render(sorted);
    }

    document.getElementById('resetBtn').addEventListener('click', ()=>{
      lastSort = null;
      data = computeStats(teams);
      render(data);
    });
  </script>
</body>
</html>
